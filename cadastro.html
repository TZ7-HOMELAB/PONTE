<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Crie sua conta de estudante na PONTE."><title>Criar conta — PONTE</title><link rel="stylesheet" href="./css/styles.css"></head><body><main class="auth-shell"><a class="brand" href="./index.html">P<span>O</span>NTE</a><section class="auth-card"><p class="eyebrow">Seu próximo passo</p><h1>Crie sua conta</h1><p class="hint">Contas públicas começam como estudante. A autorização de professor é concedida pela escola.</p><div id="status-message" class="status-message" role="status" tabindex="-1" hidden></div><form id="signup-form"><label for="full-name">Nome completo<input id="full-name" autocomplete="name" minlength="3" required></label><label for="email">E-mail<input id="email" type="email" autocomplete="email" required></label><label for="password">Senha<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">Criar conta</button></form><p>Já tem uma conta? <a href="./login.html">Entrar</a></p></section></main><script type="module" src="./js/auth.js"></script></body></html>
